<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fake Social Media Detector</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F7F7F7;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #4c2c50;
            color: white;
            padding: 15px 0;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #cd1f88;
            padding: 10px;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            margin: 0 10px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        nav a:hover {
            background-color: #cd1f88;
            color: #fff;
        }
        .container {
            width: 80%;
            margin: 20px auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        .btn {
            background-color: #cd1f88;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #b51676;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        footer {
            background-color: #4c2c50;
            color: white;
            text-align: center;
            padding: 10px 0;
            margin-top: 20px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #cd1f88;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            display: none;
            margin: 20px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        #results {
            margin-top: 20px;
            display: none;
            padding: 10px;
            background: #ecf0f1;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>SocialVerify</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="reports.html">Reports</a>
        <a href="settings.html">Settings</a>
        <a href="auth.html">Sign Up/Sign In</a>
    </nav>

    <div class="container">
        <h2>Analyze Social Media Profile</h2>
        <form id="predictionForm">
            <input type="text" id="profileUrl" placeholder="Enter Social Media Profile URL">
            <button type="submit" class="btn">Submit</button>
        </form>

        <div class="spinner" id="spinner"></div>

        <div id="results">
            <h3>Results</h3>
            <p id="predictionResult">Prediction: <strong></strong></p>
            <p id="confidenceScore">Confidence: <strong></strong></p>
        </div>
    </div>

    <footer>
        <p>© 2024 SocialVerify. All rights reserved.</p>
    </footer>

    <script>
        document.getElementById('predictionForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const profileUrl = document.getElementById('profileUrl').value.trim();
            if (!profileUrl) {
                alert('Please enter a profile URL.');
                return;
            }
            document.getElementById('spinner').style.display = 'block';
            document.getElementById('results').style.display = 'none';
            try {
                const response = await fetch("http://127.0.0.1:5000/detect", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ url: profileUrl })
                });
                const result = await response.json();
                if (!response.ok) throw new Error(result.error || "Detection failed");
                document.getElementById('predictionResult').innerHTML = `Prediction: <strong>${result.prediction}</strong>`;
                document.getElementById('confidenceScore').innerHTML = `Confidence: <strong>${result.confidence}</strong>`;
                document.getElementById('results').style.display = 'block';
            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                document.getElementById('spinner').style.display = 'none';
            }
        });
    </script>
</body>
</html>
