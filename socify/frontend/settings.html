<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - SocialVerify</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #F7F7F7;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #4c2c50;
            color: white;
            padding: 15px 0;
            text-align: center;
        }
        nav {
            display: flex;
            justify-content: center;
            background-color: #cd1f88;
            padding: 10px;
        }
        nav a {
            color: white;
            text-decoration: none;
            padding: 14px 20px;
            margin: 0 10px;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        nav a:hover {
            background-color: #cd1f88;
            color: #fff;
        }
        .container {
            width: 80%;
            margin: 20px auto;
            background-color: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.1);
        }
        footer {
            background-color: #4c2c50;
            color: white;
            text-align: center;
            padding: 10px 0;
            margin-top: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            font-weight: bold;
        }
        input[type="text"], input[type="email"], input[type="password"], input[type="file"], select {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .btn {
            background-color: #cd1f88;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .btn:hover {
            background-color: #cd1f88;
        }
    </style>
</head>
<body>
    <header>
        <h1>Settings - SocialVerify</h1>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="reports.html">Reports</a>
        <a href="settings.html">Settings</a>
        <a href="auth.html">Sign Up/Sign In</a>
    </nav>

    <div class="container">
        <h3>Account Settings</h3>
        
        <!-- Profile Settings -->
        <h4>Profile Settings</h4>
        <form id="profileForm">
            <div class="form-group">
                <label for="profilePic">Change Profile Picture</label>
                <input type="file" id="profilePic" name="profilePic">
            </div>
            <div class="form-group">
                <label for="username">Edit Username</label>
                <input type="text" id="username" name="username" value="JohnDoe">
            </div>
            <div class="form-group">
                <label for="email">Update Email</label>
                <input type="email" id="email" name="email" value="john.doe@example.com">
            </div>
            <div class="form-group">
                <label for="password">Change Password</label>
                <input type="password" id="password" name="password" placeholder="New Password">
            </div>
            <button type="submit" class="btn">Save Profile Changes</button>
        </form>

        <!-- Notification Preferences -->
        <h4>Notification Preferences</h4>
        <form id="notificationsForm">
            <div class="form-group">
                <label>Email Notifications</label>
                <select name="emailNotifications" id="emailNotifications">
                    <option value="yes">Enabled</option>
                    <option value="no">Disabled</option>
                </select>
            </div>
            <div class="form-group">
                <label>SMS/Push Notifications</label>
                <select name="smsNotifications" id="smsNotifications">
                    <option value="yes">Enabled</option>
                    <option value="no">Disabled</option>
                </select>
            </div>
            <button type="submit" class="btn">Save Notification Settings</button>
        </form>

        <!-- Account Security -->
        <h4>Account Security</h4>
        <form id="securityForm">
            <div class="form-group">
                <label for="twoFactorAuth">Enable Two-Factor Authentication</label>
                <select name="twoFactorAuth" id="twoFactorAuth">
                    <option value="yes">Enabled</option>
                    <option value="no">Disabled</option>
                </select>
            </div>
            <button type="submit" class="btn">Save Security Settings</button>
        </form>

        <!-- Account Deletion -->
        <h4>Account Deletion</h4>
        <p>If you wish to permanently delete your account, please use the button below.</p>
        <button class="btn" style="background-color: red;">Delete Account</button>
    </div>

    <footer>
        <p>© 2024 SocialVerify. All rights reserved.</p>
    </footer>
</body>
</html>
